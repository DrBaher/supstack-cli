name: Bump Homebrew formula

# After a release, point the Homebrew tap (DrBaher/homebrew-supstack) at the new
# npm tarball. Requires a repo secret HOMEBREW_TAP_TOKEN — a PAT / fine-grained
# token with `contents: write` on the tap repo. If the secret is absent the job
# no-ops (so forks and the initial setup don't fail).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to point the formula at (e.g. 0.16.0). Defaults to package.json on manual runs.'
        required: false
        type: string

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check for tap token
        id: gate
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
            echo 'HOMEBREW_TAP_TOKEN not set — skipping formula bump.'
          fi

      - name: Resolve version + sha256 (waits for the npm tarball)
        if: steps.gate.outputs.ok == 'true'
        id: meta
        run: |
          # tag push → the tag; manual run → the input, else npm's current latest.
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then VERSION="${GITHUB_REF_NAME}"; else VERSION="$(npm view @supstack/cli version)"; fi
          fi
          VERSION="${VERSION#v}"
          URL="https://registry.npmjs.org/@supstack/cli/-/cli-${VERSION}.tgz"
          # The tag starts this job and release.yml together, and npm can take 10 minutes or more to serve
          # a new tarball (about 8 minutes for 0.19.1). Wait up to 30 minutes, then fail closed: an empty
          # sha256 in the formula breaks every `brew install` (0.18.2 and 0.19.1 both shipped one).
          rm -f pkg.tgz
          for i in $(seq 1 120); do
            if curl -sfL "$URL" -o pkg.tgz && gzip -t pkg.tgz 2>/dev/null; then break; fi
            rm -f pkg.tgz
            echo "waiting for npm tarball (attempt $i)…"; sleep 15
          done
          if [ ! -s pkg.tgz ]; then
            echo "::error::npm never served $URL, the formula is left unchanged"; exit 1
          fi
          # The registry's own SHA-1 must match what we downloaded.
          NPM_SHA1="$(npm view "@supstack/cli@${VERSION}" dist.shasum)"
          GOT_SHA1="$(sha1sum pkg.tgz | cut -d' ' -f1)"
          if [ -z "$NPM_SHA1" ] || [ "$NPM_SHA1" != "$GOT_SHA1" ]; then
            echo "::error::tarball SHA-1 $GOT_SHA1 does not match npm dist.shasum '$NPM_SHA1'"; exit 1
          fi
          SHA="$(sha256sum pkg.tgz | cut -d' ' -f1)"
          if ! echo "$SHA" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::sha256 is not a 64-hex digest: '$SHA'"; exit 1
          fi
          {
            echo "version=$VERSION"
            echo "url=$URL"
            echo "sha=$SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Update tap formula
        if: steps.gate.outputs.ok == 'true'
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          # Belt and braces: never write an empty or malformed checksum.
          if ! echo "${{ steps.meta.outputs.sha }}" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::refusing to write sha256 '${{ steps.meta.outputs.sha }}'"; exit 1
          fi
          git clone "https://x-access-token:${TOKEN}@github.com/DrBaher/homebrew-supstack.git" tap
          cd tap
          sed -i -E "s#url \".*\"#url \"${{ steps.meta.outputs.url }}\"#" Formula/supstack.rb
          sed -i -E "s#sha256 \".*\"#sha256 \"${{ steps.meta.outputs.sha }}\"#" Formula/supstack.rb
          if git diff --quiet; then echo 'formula already up to date'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "supstack ${{ steps.meta.outputs.version }}"
          git push
